name: Core and archive checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without inference dependencies
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Unit tests without model downloads
        run: python -m unittest discover -s tests -v
      - name: Verify immutable research archive
        run: python scripts/verify_archive.py
      - name: Recompute published MPS study evidence without inference
        run: python scripts/verify_gate_evidence.py --archive research/experiment_10_mps_20261103/evidence_20261103.zip --receipt research/experiment_10_mps_20261103/public_evidence_receipt_20261103.json
      - name: CLI entry point
        run: pobs --help

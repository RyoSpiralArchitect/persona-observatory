[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-observatory"
version = "0.1.0"
description = "Output-based persona research with frozen evidence and portable local inference"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Ryō / RyoSpiralArchitect"}]
dependencies = []

[project.optional-dependencies]
inference = ["transformers==4.57.6", "huggingface-hub==0.36.2", "safetensors>=0.5,<1"]
dev = []

[project.scripts]
pobs = "persona_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
persona_observatory = ["resources/*.md"]
